# endolphin fork 所有の workflow。upstream の test-frontend.yml には job を足さない
# （マージ競合を避けるため）。Playwright e2e（docs/endolphin/playwright-e2e.md）。
name: Test (frontend e2e / Playwright)

on:
  push:
    branches:
      - develop
      - master
    paths:
      - packages/frontend/**
      - packages/misskey-js/**
      - packages/backend/**
      - playwright/**
      - .github/workflows/test-frontend-e2e-playwright.yml
      - .github/misskey/test.yml
  pull_request:
    paths:
      - packages/frontend/**
      - packages/misskey-js/**
      - packages/backend/**
      - playwright/**
      - .github/workflows/test-frontend-e2e-playwright.yml
      - .github/misskey/test.yml

jobs:
  e2e-playwright:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest

    # CI では infra を GitHub の service container で用意し（upstream cypress e2e と同方式・
    # 固定ポートで .github/misskey/test.yml と一致）、webServer 側は PW_SKIP_COMPOSE=1 で
    # compose 起動をスキップする。compose 公開ポートは GH runner から start:test に届かない
    # ことがあるため、ローカルは compose / CI は service container と使い分ける。
    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v6.0.2
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.3
    # NOTE: Playwright 1.61 の TS loader が .node-version (22.15.0) で
    # `context.conditions?.includes is not a function` を起こしテスト収集に失敗するため、
    # e2e ジョブのみ Node を固定する（fork 所有ジョブ・他ジョブの .node-version には影響しない）。
    - name: Use Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '22.22.2'
        cache: 'pnpm'
    # root workspace（misskey 本体）の install + build。start:test を動かすために必要。
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    # playwright/ は独立した pnpm workspace（playwright/pnpm-workspace.yaml）。
    # root package.json を汚さないよう、テストランナーはここで個別に install する。
    - name: Install Playwright runner (standalone workspace)
      run: pnpm -C playwright i --frozen-lockfile
    - name: Typecheck e2e specs
      run: pnpm -C playwright run typecheck
    - name: Install Playwright browser
      run: pnpm -C playwright exec playwright install --with-deps chromium
    - name: Playwright run
      run: pnpm -C playwright test
      timeout-minutes: 20
      env:
        CI: 'true'
        PW_SKIP_COMPOSE: '1'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: playwright-report
        path: playwright/playwright-report
