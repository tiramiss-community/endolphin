name: Test (federation)

on:
  push:
    branches:
      - master
      - develop
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-federation.yml
  pull_request:
    paths:
      - packages/backend/**
      - packages/misskey-js/**
      - .github/workflows/test-federation.yml
  workflow_dispatch:

jobs:
  test:
    name: Federation test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version-file:
          - .node-version
          - .github/min.node-version
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Install FFmpeg
        run: |
          sudo apt install -y ffmpeg
      - name: Use Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - name: Install dependencies
        run: |
          pnpm i --frozen-lockfile
      - name: Test
        if: ${{ runner.debug != '1' }}
        env:
          MISSKEY_TEST_FEDERATION_NODE_VERSION_FILE: ${{ matrix.node-version-file }}
        run: |
          pnpm --filter backend test:fed
      - name: Test with full logs
        if: ${{ runner.debug == '1' }}
        env:
          MISSKEY_TEST_FEDERATION_NODE_VERSION_FILE: ${{ matrix.node-version-file }}
        run: |
          pnpm --filter backend test:fed:debug
